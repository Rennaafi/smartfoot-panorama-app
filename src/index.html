<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFoot Panorama</title>
<style>
/* ---------- shared ---------- */
*{box-sizing:border-box;margin:0}
:root{--blue:#1f5fbf;--blue2:#e8f0fb;--ink:#14213d;--mute:#6b7a90;--line:#d8e0ec;--ok:#1f9d6b;--warn:#d98a00;--bad:#c93b3b;--bg:#f5f8fc;--card:#fff;--r:14px;font-family:"Segoe UI",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
.app{min-height:100vh;display:grid}
.steps{display:flex;gap:6px}
.step{display:flex;align-items:center;gap:10px;color:var(--mute);font-weight:600}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:#fff;font-size:14px}
.step.on{color:var(--blue)} .step.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.step.done{color:var(--ok)} .step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
main{padding:36px 44px;max-width:1100px;width:100%}
h1{font-size:30px;margin-bottom:6px} .sub{color:var(--mute);margin-bottom:26px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #1f5fbf33;border-color:var(--blue)}
.field{margin-bottom:18px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:13px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-weight:600}
.seg button.on{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.btn{padding:16px 30px;border-radius:12px;font-weight:700;font-size:18px;background:var(--blue);color:#fff;box-shadow:0 2px 0 #144a96}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 2px 0 #167a52}.btn.bad{background:#fff;color:var(--bad);border:1.5px solid var(--bad);box-shadow:none}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--blue2);color:var(--blue)}
.chip.ok{background:#e1f5ec;color:var(--ok)}.chip.warn{background:#fff1d6;color:#9a6200}
.scanwin{aspect-ratio:210/297;max-height:480px;background:#f0f3f8;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden}
.scanwin svg{width:100%;height:100%}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.checks{list-style:none;padding:0}.checks li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}.dot.w{background:var(--warn)}
.rounds{display:flex;gap:8px;margin:14px 0}
.rounds span{flex:1;text-align:center;padding:10px 4px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--mute)}
.rounds span.d{background:#e1f5ec;border-color:var(--ok);color:var(--ok)}.rounds span.c{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.big{font-size:56px;font-weight:800;letter-spacing:-1px}
.lang{font-size:13px;background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px}.brand span{color:var(--blue)}


/* ---------- theme B: top bar, big touch ---------- */
[data-theme=B]{--r:22px;--bg:#eef3fb}
[data-theme=B] .app{grid-template-rows:auto 1fr}
[data-theme=B] aside{display:flex;align-items:center;gap:30px;padding:16px 36px;background:var(--blue);color:#fff}
[data-theme=B] aside .brand span{color:#bcd6ff}
[data-theme=B] .steps{flex:1;justify-content:center;gap:26px}
[data-theme=B] .step{color:#b9d0f5}[data-theme=B] .step i{background:transparent;border-color:#8fb3ec;color:#d8e6ff}
[data-theme=B] .step.on{color:#fff}[data-theme=B] .step.on i{background:#fff;color:var(--blue);border-color:#fff}
[data-theme=B] .step.done{color:#fff}[data-theme=B] .step.done i{background:#3ec58d;border-color:#3ec58d;color:#fff}
[data-theme=B] main{max-width:1200px;margin:0 auto}
[data-theme=B] h1{font-size:38px}[data-theme=B] .btn{padding:22px 44px;font-size:22px;border-radius:18px}
[data-theme=B] input,[data-theme=B] select,[data-theme=B] .seg button{padding:18px;font-size:19px}
[data-theme=B] .card{box-shadow:0 8px 30px #1f5fbf14;border:0}
[data-theme=B] .lang{background:#ffffff22;border:0;color:#fff}

.theme-name{font-size:12px;color:var(--mute);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
</style>
</head>
<body data-theme="B">
<div class="app">
  <aside>
    <div class="brand">Smart<span>Foot</span> Panorama</div>
    <div class="steps" id="steps"></div>
    <button class="schip checking" id="schip" type="button"></button>
    <div style="margin-top:auto" class="row"><button class="lang" id="lang">ID | EN</button></div>
  </aside>
  <main id="main"></main>
</div>
<style>
table{width:100%;border-collapse:collapse;font-size:16px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.kv span:first-child{color:var(--mute);white-space:nowrap;margin-right:18px}
.gear{position:fixed;left:14px;bottom:14px}
.teambar{background:#fff7e0;border:1px solid #f0d58a;color:#7a5a00;padding:8px 14px;border-radius:10px;font-size:14px;margin-bottom:18px;font-weight:600}
</style>
<style>
.err{background:#fdecec;border:1px solid #f0b4b4;color:#8f2a2a;padding:14px 16px;border-radius:12px;margin:16px 0;font-weight:600;line-height:1.4}
.warn{background:#fff1d6;border:1px solid #f0d58a;color:#7a5a00;padding:14px 16px;border-radius:12px;margin:14px 0;font-weight:600;line-height:1.4}
.scanwin img{width:100%;height:100%;object-fit:contain}
select{appearance:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.dot.bad{background:var(--bad)}
.muted{color:var(--mute);font-size:14px}
.btn.bad.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
/* ---- press feedback: sink, lift, ripple, pop ---- */
.btn, .seg button, .lang { position: relative; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: transform .09s ease, box-shadow .09s ease, background-color .15s ease, border-color .15s ease, filter .15s ease; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #144a96, 0 10px 18px #1f5fbf30; filter: none; }
.btn:active { transform: translateY(2px) scale(.985); box-shadow: 0 0 0 #144a96, inset 0 3px 8px #0003; filter: brightness(.94); transition-duration: .03s; }
.btn.ok:hover { box-shadow: 0 4px 0 #167a52, 0 10px 18px #1f9d6b30; }
.btn.ok:active { box-shadow: 0 0 0 #167a52, inset 0 3px 8px #0003; }
.btn.ghost, .btn.bad { box-shadow: none; }
.btn.ghost:hover { background: var(--blue2); border-color: var(--blue); box-shadow: 0 6px 14px #1f5fbf1f; }
.btn.bad:hover { background: #fdecec; box-shadow: 0 6px 14px #c93b3b22; }
.btn.bad.armed:hover { background: #b32f2f; }
.btn.ghost:active, .btn.bad:active { box-shadow: inset 0 3px 8px #0002; }
.seg button:hover { border-color: var(--blue); background: var(--blue2); }
.seg button:active { transform: scale(.96); }
.seg button.on { animation: pop .22s ease; }
.lang:hover { filter: brightness(1.15); }
.lang:active { transform: scale(.94); }
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
.btn:focus-visible, .seg button:focus-visible, .lang:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
.ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .28; transform: scale(0); pointer-events: none; animation: ripple .55s ease-out forwards; }
.btn.ghost .ripple, .seg button .ripple { background: var(--blue); opacity: .22; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.btn[disabled] { transform: none; box-shadow: none; }
/* ---- scanner status chip (top bar) ---- */
.schip { display:inline-flex; align-items:center; gap:9px; padding:8px 16px; border-radius:999px; font-weight:700; font-size:15px; background:#ffffff26; color:#fff; transition: background-color .2s ease; }
.schip:hover { background:#ffffff3d; }
.schip .d { width:12px; height:12px; border-radius:50%; background:#cdd8ea; flex:none; }
.schip.ready .d { background:#3ec58d; box-shadow:0 0 0 4px #3ec58d44; }
.schip.attn .d { background:#ffb703; box-shadow:0 0 0 4px #ffb70355; }
.schip.missing { background:#c93b3b; }
.schip.missing .d { background:#fff; animation: blink 1.2s ease-in-out infinite; }
.schip.checking .d { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity:.25; } }
@media (prefers-reduced-motion: reduce) { .schip .d { animation: none !important; } }
.schip:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
i.sc { font-style: italic; }
@media (prefers-reduced-motion: reduce) { .btn, .seg button, .lang { transition: none; } .ripple, .seg button.on { animation: none; } }
</style>
<style>
/* ---- review: outline switch, main values, fold-out ---- */
.tog{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:8px;background:#ffffffe6;padding:6px 12px 6px 8px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;margin:0;box-shadow:0 2px 8px #0003}
.tog input{appearance:none;width:38px;height:22px;border-radius:99px;background:#c3cddb;position:relative;padding:0;border:0;cursor:pointer;transition:background .15s}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog input:checked{background:var(--blue)}.tog input:checked::after{left:19px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.met{background:var(--bg);border-radius:14px;padding:12px 14px}
.ml{color:var(--mute);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.mv{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-top:2px}.mv small{font-size:15px;font-weight:600;color:var(--mute)}
.mp{color:var(--mute);font-size:13px}.mp2{font-style:normal;font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
.ib{width:20px;height:20px;border-radius:50%;background:var(--blue2);color:var(--blue);font:italic 700 13px Georgia,serif;display:inline-grid;place-items:center;margin-left:6px;vertical-align:middle;flex:none}
.ib:hover{background:var(--blue);color:#fff}
.more{margin-top:14px}.more summary{cursor:pointer;font-weight:700;color:var(--blue);padding:8px 0;list-style:none}
.more summary::before{content:"▸ ";display:inline-block;transition:transform .15s}.more[open] summary::before{transform:rotate(90deg)}
.more .kv span{display:flex;align-items:center}
/* ---- modal ---- */
.modal{position:fixed;inset:0;background:#14213d8c;display:grid;place-items:center;z-index:50;animation:fadein .15s ease}
.mbox{background:#fff;border-radius:20px;padding:24px 28px;max-width:560px;width:calc(100% - 40px);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 60px #0005;animation:popin .2s ease}
.mbox.wide{max-width:960px}
.mhead{display:flex;align-items:center;margin-bottom:12px}.mhead h3{font-size:26px}.mx{margin-left:auto;padding:6px 14px!important;font-size:18px!important}
.mcols{display:flex;gap:24px;align-items:flex-start}.mtext{flex:1;line-height:1.5;font-size:16px}.mtext p{margin-bottom:10px}
.mtext h4{margin:16px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.refs{padding-left:22px;font-size:13px;color:var(--ink);line-height:1.45}.refs li{margin-bottom:6px}
.viz{flex:0 0 330px}.vizsvg{width:100%;max-height:440px;background:#10151f;border-radius:12px;display:block}
.formula{margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center}
@keyframes fadein{from{opacity:0}}@keyframes popin{from{transform:scale(.96);opacity:0}}
/* animation steps */
.draw{animation:draw .9s ease forwards .25s}.draw.s2{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:popdot .35s ease forwards}
@keyframes popdot{0%{opacity:0;transform:scale(.2)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.fade,.lab,.formula{opacity:0;animation:fadeto .5s ease forwards}
@keyframes fadeto{to{opacity:var(--o,1)}}
.lab{fill:#fff;font-weight:800;paint-order:stroke;stroke:#000a;stroke-width:3px}
.s1{animation-delay:.2s}.s3{animation-delay:1.4s}.s4{animation-delay:2s}.s5{animation-delay:2.8s}
/* ---- guide ---- */
.gstep{display:flex;gap:28px;align-items:center}.gpic{flex:0 0 260px;height:260px;background:var(--bg);border-radius:16px}
.gnum{color:var(--blue);font-weight:700;font-size:14px}
.gdots{display:flex;gap:8px;justify-content:center;margin-top:16px}.gdots span{width:10px;height:10px;border-radius:50%;background:var(--line);cursor:pointer}.gdots span.on{background:var(--blue);width:26px;border-radius:99px}
.scanbar{animation:scanmove 2.2s ease-in-out infinite alternate}@keyframes scanmove{to{transform:translateY(164px)}}
/* ---- tour ---- */
#tour{position:fixed;inset:0;z-index:60}
#tour .spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px #14213d99;transition:all .25s ease;pointer-events:none;outline:3px solid #ffb703}
#tour .tip{position:fixed;width:380px;background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 14px 40px #0005;animation:popin .2s ease}
#tour .tip h4{font-size:20px;margin:4px 0 6px}#tour .tip p{line-height:1.45}
#tour .hide{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;color:var(--mute);margin-top:12px}
#tour .hide input{width:auto;padding:0}
/* ---- data folder line, setup, calibration figures ---- */
.ddline{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:16px}
.linkbtn{background:none;color:var(--blue);font-weight:700;padding:0;text-decoration:underline;font-size:inherit}
.rfig{margin:12px 0 0}.rfig img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}.rfig figcaption{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.4}
.calanim{width:100%;margin:12px 0 4px;display:block}.ca-t{font-size:11px;fill:#14213d;text-anchor:middle;font-weight:600}
.ca-slide{animation:caslide 6s infinite}@keyframes caslide{0%{transform:translateY(-30px);opacity:0}15%,100%{transform:none;opacity:1}}
.ca-cloth{animation:cacloth 6s infinite}@keyframes cacloth{0%,22%{opacity:0;transform:translateY(-14px)}38%,100%{opacity:.97;transform:none}}
.ca-bar{animation:cabar 6s infinite}@keyframes cabar{0%,44%{transform:translateY(0);opacity:0}47%{opacity:1}70%{transform:translateY(112px);opacity:1}73%,100%{opacity:0;transform:translateY(112px)}}
.ca-zoom{transform-box:fill-box;transform-origin:center;animation:cazoom 6s infinite}@keyframes cazoom{0%,72%{opacity:0;transform:scale(.3)}82%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.ca-slide,.ca-cloth,.ca-bar,.ca-zoom{animation:none}}
/* ---- logo + opening animation ---- */
.brand-logo{display:inline-block;width:14px;height:32px;color:#fff;vertical-align:-8px;margin-right:8px}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#2a6fd6,#1f5fbf 45%,#163f80);display:grid;place-items:center;color:#fff;cursor:pointer;transition:opacity .38s ease}
#splash.out{opacity:0}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:22px}
.sp-logo{width:82px;height:192px;color:#fff;filter:drop-shadow(0 6px 18px #0004)}
.sp-logo .lg-sole{stroke-dasharray:720;stroke-dashoffset:720;fill-opacity:0;animation:draw 1.15s ease forwards .15s,fillin .45s ease forwards 1.1s}
@keyframes fillin{to{fill-opacity:1}}
.sp-logo .lg-toe{opacity:0;transform-box:fill-box;transform-origin:center;animation:popdot .3s ease forwards;animation-delay:calc(1.05s + var(--d) * .08s)}
.sp-name{font-size:40px;font-weight:800;letter-spacing:-.5px;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards 1.35s}.sp-name span{color:#bcd6ff}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sp-logo .lg-sole,.sp-logo .lg-toe,.sp-name,.draw,.pop,.fade,.lab,.formula,.scanbar{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
<style>
/* ---- v2: point check ---- */

.remlist{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
.remrow{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.ckcard .chip{margin-right:4px}
.ckgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}

.hdl{cursor:grab}.hdl.off{pointer-events:none;opacity:.55}.hdl.cur circle:first-child{stroke-width:5}.ckex{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ckex figure{margin:0}.ckex img{width:100%;max-height:260px;object-fit:contain;background:#000;border-radius:10px;display:block}.ckex figcaption{font-weight:700;font-size:13px;margin-top:4px}.ckex .g{color:#1f9d6b}.ckex .r{color:#c93b3b}.hdl.on{cursor:grabbing}.hdl.on circle:first-child{stroke-width:5}

<style>

.step.go{cursor:pointer}.step.go:hover b{text-decoration:underline;text-underline-offset:4px}
.steps.off{display:none!important}
[data-theme=B] aside{flex-wrap:wrap;row-gap:12px}[data-theme=B] .steps{order:10;flex:1 0 100%;justify-content:center;padding-top:12px;border-top:1px solid #ffffff2e}[data-theme=B] aside .row{margin-left:auto}.step b{white-space:nowrap}
[data-theme=B] aside{gap:20px}[data-theme=B] aside .row{flex-wrap:nowrap;gap:8px}[data-theme=B] .steps{gap:12px;min-width:0}.step b{font-size:15px}.step i{flex:none}

.pick:hover,.pick.on{border-color:var(--blue);background:var(--blue2);color:var(--blue)}
.unit{display:flex;align-items:center;gap:10px}.unit span{color:var(--mute);font-weight:600;white-space:nowrap}
.plist td,.plist th{text-align:left;vertical-align:middle}.plist .chip{white-space:nowrap}.plist tr.gone td{color:var(--mute)}
.plist td.conc{font-size:13px;color:var(--mute);max-width:330px;line-height:1.35}
.lock{text-align:center;padding:70px 20px}.lock .big{font-size:80px;color:var(--blue)}
.pname{font-size:20px;font-weight:800}
.concbox{margin-top:14px;background:var(--bg);border-radius:12px;padding:12px 16px;line-height:1.45;font-size:16px}
/* ---- v2: INLOW form ---- */
.igroup{margin:22px 0 4px;font-size:13px;font-weight:800;letter-spacing:1px;color:var(--blue)}.igroup:first-of-type{margin-top:6px}
.irow{display:grid;grid-template-columns:230px 1fr 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.irow.ihead{position:sticky;top:0;background:#fff;z-index:2;font-weight:800;font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;padding-top:0}
.ilab{font-weight:700;font-size:16px;line-height:1.35}
.iopts{display:flex;flex-direction:column;gap:6px}
.iopt{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:9px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--line);font-size:15px;line-height:1.3}
.iopt em{font-style:normal;font-weight:800;color:var(--mute);min-width:16px;text-align:right}
.iopt:hover{border-color:var(--blue)}.iopt.on{background:var(--blue2);border-color:var(--blue);color:var(--blue)}.iopt.on em{color:var(--blue)}
.iq{padding:4px 0 12px;border-bottom:1px solid var(--line);font-size:15px}.iq summary{cursor:pointer;color:var(--blue);font-weight:700;padding:6px 0}
.iqrow{display:grid;grid-template-columns:230px 1fr 1fr;gap:16px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.seg.mini button{padding:8px 10px!important;font-size:15px!important;border-radius:9px}
.seg.small button{padding:10px 18px!important;font-size:16px!important}
.ibar{position:sticky;bottom:0;margin-top:16px;background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 -6px 24px #1f5fbf1f;display:flex;gap:18px;align-items:center;flex-wrap:wrap;z-index:3}
.isum{font-size:16px}
.chip.riskA{background:#e1f5ec;color:#167a52}.chip.riskB{background:#eaf6d8;color:#4f7a12}.chip.riskC{background:#fff1d6;color:#9a6200}.chip.riskD{background:#ffe3d1;color:#a8460b}.chip.riskE{background:#fdecec;color:#b32f2f}
/* ---- v2: manual marks ---- */
.mkbox{background:#10151f;border-radius:12px;overflow:hidden;min-height:120px;aspect-ratio:210/297;max-height:520px;display:grid;place-items:center}
.mkbox .muted{color:#9aa6b8}
.mksvg{width:100%;height:100%;display:block}.mksvg.on{cursor:crosshair}.mksvg.on .mk{cursor:pointer}
.mklab{fill:#fff;font-weight:800;font-size:22px;paint-order:stroke;stroke:#000a;stroke-width:4px}
</style>

<script src="extra.js"></script>
